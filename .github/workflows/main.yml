name: CI

on: [pull_request, push]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-docker:
    strategy:
      fail-fast: false
      matrix:
        include:
          - container: wpilib/systemcore-cross-debian:trixie
            artifact-name: SystemCore
            build-options: "-Pplatform=linux-systemcore -Ptoolchain=/usr/local/toolchain-config.cmake"
          - container: wpilib/aarch64-cross-debian:trixie
            artifact-name: Arm64
            build-options: "-Pplatform=linux-arm64 -Ptoolchain=/usr/local/toolchain-config.cmake"
          - container: wpilib/debian-base:trixie
            artifact-name: Linux
            build-options: ""

    name: "Build - ${{ matrix.artifact-name }}"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-8vcpu-ubuntu-2404', 'ubuntu-24.04') }}
    container: ${{ matrix.container }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - run: sudo apt-get update && sudo apt-get install ant -y && sudo rm -rf /var/lib/apt/lists/* && sudo rm -f /bin/ant && sudo ln -s /usr/share/ant/bin/ant /bin/ant
        name: Install Ant
      - run: ./gradlew build -PjenkinsBuild ${{ matrix.build-options }}
        name: Build with Gradle
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: gradleDir/outputs/

  build-windows:
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact-name: Win64Release
            build-options: "-PskipDebug"
            arch: x64
          - artifact-name: WinArm64Release
            build-options: "-PskipDebug -Pplatform=windows-arm64"
            arch: amd64_arm64
          - artifact-name: Win64
            build-options: "-PskipRelease -PskipSources"
            arch: x64
          - artifact-name: WinArm64
            build-options: "-PskipRelease -PskipSources -Pplatform=windows-arm64"
            arch: amd64_arm64

    name: "Build - ${{ matrix.artifact-name }}"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-4vcpu-windows-2025', 'windows-2025') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: ${{ matrix.arch }}
      - run: |
          set PATH=%PATH%;%ANT_HOME%\bin
          gradlew build -PjenkinsBuild ${{ matrix.build-options }}
        shell: cmd
        name: Build with Gradle
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: gradleDir/outputs/

  build-mac:
    name: "Build - macOS (Arm)"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-6vcpu-macos-15', 'macOS-15') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - run: ./gradlew build -PjenkinsBuild
        name: Build with Gradle
      - uses: actions/upload-artifact@v7
        with:
          name: macOSArm
          path: gradleDir/outputs/

  build-mac-arm:
    name: "Build - macOS"
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-6vcpu-macos-15', 'macOS-15') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - run: ./gradlew build -PjenkinsBuild -Pforcealternatemacbuild
        name: Build with Gradle
      - uses: actions/upload-artifact@v7
        with:
          name: macOS
          path: gradleDir/outputs/

  make_universal:
    name: Make Universal
    needs: [build-mac, build-mac-arm]
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-6vcpu-macos-15', 'macOS-15') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: macOS
          path: build/downloads
      - uses: actions/download-artifact@v8
        with:
          name: macOSArm
          path: build/downloads
      - uses: actions/setup-java@v6
        with:
          java-version: 25
          distribution: 'temurin'
      - run: ./gradlew copyToUpload -Prunmerge
        name: Build with Gradle
        if: |
          github.repository_owner != 'wpilibsuite' ||
          (github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/v'))
      - name: Import Developer ID Certificate
        uses: wpilibsuite/import-signing-certificate@v2
        with:
          certificate-data: ${{ secrets.APPLE_CERTIFICATE_DATA }}
          certificate-passphrase: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
        if: |
          github.repository_owner == 'wpilibsuite' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      - run: ./gradlew copyToUpload -Prunmerge -PdeveloperID=${{ secrets.APPLE_DEVELOPER_ID }}
        name: Sign Binaries with Developer ID
        if: |
          github.repository_owner == 'wpilibsuite' &&
          (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
      - uses: actions/upload-artifact@v7
        with:
          name: macOSUniversal
          path: build/toUpload/

  combine:
    name: Combine
    needs: [build-docker, build-windows, make_universal]
    runs-on: ${{ case(github.repository_owner == 'wpilibsuite', 'blacksmith-4vcpu-ubuntu-2404', 'ubuntu-24.04') }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: wpilibsuite/build-tools
      - uses: actions/download-artifact@v8
        with:
          path: combiner/products/build/allOutputs
      - name: Flatten Artifacts
        run: |
          rm -r combiner/products/build/allOutputs/macOS combiner/products/build/allOutputs/macOSArm
          rsync -a --delete combiner/products/build/allOutputs/*/* combiner/products/build/allOutputs/
      - name: Combine
        if: |
          !startsWith(github.ref, 'refs/tags/v')
        run: ./gradlew publish -Pthirdparty
        working-directory: combiner
      - name: Combine (Release)
        if: |
          github.repository_owner == 'wpilibsuite' &&
          startsWith(github.ref, 'refs/tags/v')
        run: |
          ./gradlew publish -Pthirdparty
        working-directory: combiner
        env:
          RUN_AZURE_ARTIFACTORY_RELEASE: 'TRUE'
          ARTIFACTORY_PUBLISH_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
          ARTIFACTORY_PUBLISH_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
      - uses: actions/upload-artifact@v7
        with:
          name: Maven
          path: ~/releases
